title: Alingsås Ju-Jutsuklubb
description: "Träna ju-jutsu i Alingsås. Träning för barn och vuxna hos Alingsås Ju-Jutsuklubb på Tennisvägen 8. Se grupper, träningstider och kontaktuppgifter."
url: https://alingsasju-jutsu.se
baseurl: ""
lang: sv-SE
locale: sv_SE
logo: /assets/images/cropped-test3.png

club:
  address_url: "https://www.google.com/maps/place/Alings%C3%A5s+Ju-Jutsuklubb/@57.9346882,12.5255806,15z/data=!4m5!3m4!1s0x0:0x95ada11212f52a2!8m2!3d57.9346882!4d12.5255806"

markdown: kramdown
permalink: pretty

collections:
  club_pages:
    output: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - _old_site
  - vendor
  - tools
  - _club_pages/nyheter/_mall.md
  - _club_pages/graderingar/_mall.md

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/cropped-test3.png
        width: 223
        height: 222
        alt: Alingsås Ju-Jutsuklubbs logotyp
  - scope:
      path: ""
      type: club_pages
    values:
      layout: page
