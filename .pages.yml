media:
  input: assets/images
  output: /assets/images

content:
  - name: activities
    label: Kommande händelser
    type: collection
    path: _activities
    format: yaml-frontmatter
    subfolders: false
    exclude: [".gitkeep"]
    filename: "{primary}-{fields.event_date}.md"
    view:
      fields: [title, event_date]
      primary: title
      sort: [event_date]
      default:
        sort: event_date
        order: asc
    fields:
      - name: title
        label: Rubrik
        type: string
        required: true
        description: "En kort och tydlig rubrik. Visas i Kommande händelser, på startsidans anslagstavla och överst på händelsens egen sida."
      - name: event_date
        label: Händelsedatum
        type: date
        required: true
        options: { format: yyyy-MM-dd }
        description: "Dagen händelsen äger rum, inte dagen du skriver inlägget. Alla framtida händelser listas på Kommande händelser. Startsidan visar bara de närmaste sex veckorna. Efter händelsedagen försvinner inlägget från listorna vid nästa bygge. Webbplatsen uppdateras varje måndag och vid publicering."
      - name: description
        label: Kort sammanfattning
        type: text
        required: true
        description: "En eller två meningar för anslagstavlan och sökresultat. Besökaren klickar på rubriken för att läsa händelsens egen sida."
      - name: body
        label: Mer information
        type: rich-text
        required: true
        description: "Den fullständiga texten på händelsens egen sida, till exempel tid, plats och hur man anmäler sig. Använd underrubriker (rubriknivå 2), listor och länkar vid behov. Sidan finns kvar när anslaget har försvunnit. Radera händelsen om även sidan ska tas bort."
      - name: images
        label: Bilder (valfritt)
        type: object
        list: true
        description: "Lägg till en eller flera bilder. De visas efter texten på händelsens egen sida, i den ordning du väljer här."
        fields:
          - { name: image, label: Bild, type: image, required: true, description: "Ladda upp eller välj en bild som klubben får publicera." }
          - { name: alt, label: Bildbeskrivning, type: string, required: true, description: "Beskriv kort vad bilden visar. Texten används av skärmläsare och när bilden inte kan visas." }

  - name: schedule
    label: Träningstider och avgifter
    type: file
    path: _data/groups.yml
    format: yaml
    fields:
      - name: term_start
        label: Terminsstart
        type: object
        description: "Gemensam terminsstart för alla grupper. Visas på anslagstavlan från tre veckor före till tre veckor efter datumet, vid senaste bygget."
        fields:
          - { name: date, label: Startdatum, type: date, options: { format: yyyy-MM-dd }, description: "Ange datum med årtal. Lämna tomt om terminsstarten inte är bestämd. Rubriken är alltid Terminsstart. Ordinarie träningstider publiceras direkt vid sammanslagning, inte först vid startdatumet." }
      - name: exceptions
        label: Avvikelser (gamla datum döljs vid nästa bygge)
        type: object
        list: true
        description: "Varje avvikelse visas i schemat och även på startsidans anslagstavla när datumet är högst fyra veckor bort. Den visas till och med sitt datum vid senaste bygget. Gamla datum döljs vid nästa bygge, normalt varje måndag. Beskriv vilka grupper som berörs om det inte gäller alla."
        fields:
          - { name: date, label: Datum, type: string, description: "Ett giltigt datum i formatet ÅÅÅÅ-MM-DD, t.ex. 2027-01-10." }
          - { name: reason, label: Orsak, type: string }
      - name: fees
        label: Avgifter
        type: object
        fields:
          - name: term
            label: Terminsavgift
            type: object
            fields:
              - { name: toddlers, label: Knattar, type: number }
              - { name: children, label: Barn, type: number }
              - name: adults
                label: Vuxna
                type: object
                list: true
                fields:
                  - { name: ages, label: Ålder, type: string }
                  - { name: fee, label: Avgift, type: number }
          - name: family_discount
            label: Familjerabatt
            type: object
            fields:
              - { name: fee, label: Avgift, type: number }
              - { name: minimum_people, label: Minsta antal personer, type: number }
          - { name: supporting_membership, label: Stödmedlemskap, type: number }
          - name: grading
            label: Graderingsavgift
            type: object
            fields:
              - { name: toddlers, label: Knattar, type: number }
              - { name: children, label: Barn, type: number }
              - { name: adults, label: Vuxna, type: number }
          - { name: replacement_grading_pass, label: Ersättningsgraderingspass, type: number }
      - name: groups
        label: Grupper
        type: object
        fields:
          - name: toddlers
            label: Knattar
            type: object
            fields: &group_fields
              - { name: name, label: Namn, type: string }
              - { name: type, label: Typ, type: string, description: "barn eller vuxen" }
              - { name: ages, label: Ålder, type: string }
              - name: sessions
                label: Träningstillfällen
                type: object
                list: true
                fields:
                  - { name: day, label: Dag, type: string, description: "T.ex. Söndagar" }
                  - { name: start, label: Start, type: string, description: "Format 18.30" }
                  - { name: end, label: Slut, type: string, description: "Format 19.30" }
              - name: grading
                label: Gradering
                type: object
                description: "Graderingstiden visas på startsidans anslagstavla från sex veckor före datumet och på Schema utan sexveckorsgräns. Ett passerat datum döljs vid nästa bygge, normalt varje måndag. En tid utan datum visas bara på Schema. Lämna båda tomma för att inte visa någon graderingstid."
                fields:
                  - { name: date, label: Datum, type: string, description: "Ett giltigt datum i formatet ÅÅÅÅ-MM-DD. En tid utan datum döljs inte automatiskt." }
                  - { name: time, label: Tid, type: string, description: "Format 14:00. Om bara datum fylls i visas att tiden kommer snart." }
                  - { name: is_preliminary, label: Preliminärt, type: boolean, description: "Markera om datumet eller tiden ännu inte är fastställd." }
          - name: children
            label: Barn
            type: object
            fields: *group_fields
          - name: adults
            label: Vuxna
            type: object
            fields: *group_fields

  - name: news
    label: Nyheter
    type: collection
    path: _club_pages/nyheter
    format: yaml-frontmatter
    subfolders: true
    filename: "{primary}/{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields: &article_fields
      - { name: title, label: Rubrik, type: string, required: true }
      - { name: description, label: Kort sammanfattning, type: text, required: true }
      - { name: date, label: Publiceringsdatum, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: image_descriptions
        label: Bildbeskrivningar (alt-text)
        type: object
        description: "Filnamn på bilden i samma mapp och dess beskrivning."
      - { name: body, label: Text, type: rich-text }

  - name: gradings
    label: Graderingar
    type: collection
    path: _club_pages/graderingar
    format: yaml-frontmatter
    subfolders: true
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields: *article_fields

  - name: pages
    label: Sidor
    type: group
    items:
      - name: association_pages
        label: Föreningen
        type: collection
        path: _club_pages/foreningen
        format: yaml-frontmatter
        subfolders: false
        fields: &page_fields
          - { name: title, label: Rubrik, type: string, required: true }
          - { name: description, label: Kort sammanfattning, type: text }
          - { name: permalink, label: Webbadress, type: string, required: true, readonly: true, description: "Sidans fasta adress. Ska bevaras när innehållet redigeras." }
          - { name: category, label: Menygrupp, type: string, hidden: true }
          - { name: layout, label: Sidmall, type: string, hidden: true }
          - { name: maintained_content, label: Redaktionellt innehåll, type: boolean, hidden: true, default: true }
          - { name: source_id, label: Käll-ID, type: string, hidden: true }
          - { name: source_date, label: Källdatum, type: string, hidden: true }
          - { name: historical, label: Historiskt underlag, type: boolean, hidden: true }
          - { name: body, label: Text, type: rich-text }
      - name: training_pages
        label: Träning & praktiskt
        type: collection
        path: _club_pages/traning-praktiskt
        format: yaml-frontmatter
        subfolders: false
        fields: *page_fields
      - name: jujutsu_pages
        label: Om Ju-Jutsu
        type: collection
        path: _club_pages/om-ju-jutsu
        format: yaml-frontmatter
        subfolders: false
        fields: *page_fields
      - name: getting_started
        label: Börja träna
        type: file
        path: _club_pages/borja-trana.md
        format: yaml-frontmatter
        fields: *page_fields

  - name: archive
    label: Arkiv – äldre innehåll
    type: group
    items:
      - name: archived_news
        label: Arkiverade nyheter
        type: collection
        path: _club_pages/archive/nyheter
        format: yaml-frontmatter
        subfolders: true
        operations: { create: false }
        fields: *article_fields
      - name: archived_gradings
        label: Arkiverade graderingar
        type: collection
        path: _club_pages/archive/graderingar
        format: yaml-frontmatter
        subfolders: true
        operations: { create: false }
        fields: *article_fields
      - name: archived_pages
        label: Arkivöversikter och läger
        type: collection
        path: _club_pages/archive
        format: yaml-frontmatter
        subfolders: true
        exclude: ["nyheter/**", "graderingar/**"]
        operations: { create: false }
        fields:
          - { name: title, label: Rubrik, type: string, required: true }
          - { name: description, label: Kort sammanfattning, type: text }
          - { name: body, label: Text, type: rich-text, description: "Historiskt innehåll. Nya händelser läggs till under Kommande händelser." }

  - name: instructors
    label: Instruktörer
    type: file
    path: _data/instructors.yml
    format: yaml
    fields:
      - name: instructors
        label: Instruktörer
        type: object
        list: true
        fields:
          - { name: name, label: Namn, type: string }
          - { name: groups, label: Grupper, type: select, multiple: true, options: { values: [toddlers, children, adults] } }
          - { name: phone, label: Telefon, type: string }
          - { name: level, label: Grad, type: string }
          - { name: color, label: Bältesfärg, type: string }
          - { name: image, label: Porträtt, type: image }
          - { name: description, label: Beskrivning, type: text }

  - name: graphics
    label: Grafik
    type: file
    path: _data/graphics.yml
    format: yaml
    fields:
      - name: graphics
        label: Grafik och affischer
        type: object
        fields:
          - name: training
            label: Träningsaffisch (Blackbelt)
            type: object
            fields: &training_graphic_fields
              - { name: title, label: Titel, type: string }
              - { name: include_schedule, label: Inkludera schema, type: boolean }
              - { name: background, label: Bakgrundsbild, type: image }
              - { name: sizes, label: Storlekar (px), type: number, list: true }
              - { name: include_website, label: Inkludera webbadress, type: boolean }
              - { name: include_address, label: Inkludera adress, type: boolean }
              - { name: bottom_margin_percent, label: Bottenmarginal (%), type: number }
              - { name: font, label: Typsnitt, type: select, options: { values: [antonio, typewriter, condensed] } }
              - { name: font_color, label: Textfärg (hex), type: string }
              - { name: font_size, label: Textstorlek, type: number }
              - { name: line_spacing, label: Radavstånd, type: number }
              - { name: term_start_font_size, label: Textstorlek terminsstart, type: number }
              - { name: term_start_spacing, label: Radavstånd terminsstart, type: number }
          - name: tattoo
            label: Träningsaffisch (Tattoo)
            type: object
            fields: *training_graphic_fields
          - name: logo
            label: Logotyp
            type: object
            fields:
              - { name: title, label: Titel, type: string }
              - { name: include_schedule, label: Inkludera schema, type: boolean }
              - { name: background, label: Bildfil, type: image }
          - name: grading_blackbelt
            label: Graderingsaffisch (Blackbelt)
            type: object
            fields: &grading_graphic_fields
              - { name: title, label: Titel, type: string }
              - { name: include_schedule, label: Inkludera schema, type: boolean }
              - { name: include_grading_times, label: Inkludera graderingstider, type: boolean }
              - { name: background, label: Bakgrundsbild, type: image }
              - { name: sizes, label: Storlekar (px), type: number, list: true }
              - { name: bottom_margin_percent, label: Bottenmarginal (%), type: number }
              - { name: font, label: Typsnitt, type: select, options: { values: [antonio, typewriter, condensed] } }
              - { name: font_color, label: Textfärg (hex), type: string }
              - { name: grading_title, label: Rubrik, type: string }
              - { name: grading_title_font_size, label: Rubrikstorlek, type: number }
              - { name: grading_group_font_size, label: Gruppnamnstorlek, type: number }
              - { name: grading_detail_font_size, label: Datum/tidstorlek, type: number }
              - { name: line_spacing, label: Radavstånd, type: number }
              - { name: info, label: Informationstext under tiderna, type: text }
          - name: grading_tattoo
            label: Graderingsaffisch (Tattoo)
            type: object
            fields: *grading_graphic_fields

  - name: home
    label: Startsidan
    type: file
    path: _club_pages/index.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string }
      - name: hero
        label: Huvudbild
        type: object
        fields:
          - { name: eyebrow, label: Överrubrik, type: string }
          - { name: heading, label: Rubrik, type: string }
          - { name: button_text, label: Knapptext, type: string }
          - { name: button_url, label: Knapplänk, type: string }
      - { name: schedule_label, label: Rubrik för träningstider, type: string }
      - name: navigation
        label: Navigering
        type: object
        fields:
          - { name: eyebrow, label: Överrubrik, type: string }
          - { name: heading, label: Rubrik, type: string }
      - { name: body, label: Text, type: rich-text }
